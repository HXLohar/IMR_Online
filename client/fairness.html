<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMR Online</title>
  <link rel="stylesheet" href="/src/fairness.css" />
</head>
<body>
  <main>
    <header><a href="/">IMR ONLINE</a><select id="language-select" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option></select></header>
    <h1 id="page-title"></h1>
    <p data-i18n="fairness.limit"></p>
    <section id="history" hidden aria-live="polite"></section>
    <section id="verify" hidden>
      <p data-i18n="fairness.instructions"></p>
      <details><summary data-i18n="fairness.import"></summary><label for="proof-input" data-i18n="fairness.proof"></label><textarea id="proof-input" rows="8"></textarea><button id="import-proof" type="button" data-i18n="fairness.fill"></button></details>
      <form id="verify-form">
        <label for="server-key" data-i18n="fairness.key"></label><input id="server-key" required pattern="[a-fA-F0-9]{64}" maxlength="64" autocomplete="off" spellcheck="false" />
        <label for="expected-key-hash" data-i18n="fairness.expectedKey"></label><input id="expected-key-hash" pattern="[a-fA-F0-9]{64}" maxlength="64" spellcheck="false" />
        <label for="match-id" data-i18n="fairness.matchId"></label><input id="match-id" required pattern="[A-Za-z0-9_-]{1,128}" maxlength="128" />
        <div class="row"><label><span data-i18n="fairness.hand"></span><input id="hand-number" type="number" required min="1" max="8" value="1" /></label><label><span data-i18n="fairness.dealer"></span><input id="dealer-seat" type="number" required min="0" max="3" value="0" /></label></div>
        <div id="players"></div>
        <label for="expected-wall-hash" data-i18n="fairness.expectedWall"></label><input id="expected-wall-hash" pattern="[a-fA-F0-9]{64}" maxlength="64" spellcheck="false" />
        <button id="verify-button" type="submit" data-i18n="fairness.calculate"></button>
      </form>
      <section id="verification-output" hidden></section>
    </section>
    <p id="error" role="alert" aria-live="polite"></p>
  </main>
  <script type="module" src="/src/fairness-page.ts"></script>
</body>
</html>

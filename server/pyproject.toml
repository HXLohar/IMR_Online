[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "imr-online-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[tool.setuptools]
py-modules = ["app", "db", "multiplayer"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bots*", "game*", "protocol*", "scoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "imr-online-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
